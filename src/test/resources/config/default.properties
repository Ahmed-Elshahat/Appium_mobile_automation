# URPay Default Configuration
# Replaces: Katalon Profiles/default.glbl

# ── Environment (SIT or UAT) ──
# Switch via: -Denv=uat  or  mvn test -Denv=uat
env=SIT

# ── App Settings ──
appPackage=com.urpay.consumer.sit
appActivity=com.urpay.consumer.sit.MainActivity
bundleId=com.urpay.consumer.sit

# ── Platform ──
platform=android
appiumUrl=http://127.0.0.1:4723

# ── Execution ──
remote=true
timeout=20

# ── Device ──
deviceName=Samsung Galaxy S23 Ultra
platformVersion=14

# ── Configuration Setup (replaces GlobalVariable.configurationSetup) ──
config.isSuiteVideoRecordingEnabled=false
config.isMobileCacheRemoverEnabled=false
config.appLanguage=English
config.isConnectedToJira=false
config.isSafeModeEnabled=false
config.isSessionTimeout=false

# ── Default Credentials ──
urpayUser.mobileNumber=0520680682
urpayUser.id=2600284372
urpayUser.verificationCode=1234
urpayUser.passCode=2233

# ── LambdaTest (only used when remote=true) ──
# Credentials supplied via environment variables: LT_USERNAME, LT_ACCESS_KEY
lt.username=${LT_USERNAME}
lt.accessKey=${LT_ACCESS_KEY}
lt.url=https://mobile-hub.lambdatest.com/wd/hub
lt.build=URPay-Appium-Smoke
lt.appUrl=lt://APP10160411311780304827767325
