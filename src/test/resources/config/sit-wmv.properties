# The wallet blocks reusing a recently-used passcode ("must be different from the ones you used
# before"), so a fixed newPasscode fails on every re-run. Rotate through this pool instead — each
# run picks the next value (index persisted in target/passcode-rotation.properties). Fresh values
# come first; 3344 is last so it is not reused until the pool has cycled past the history window.
