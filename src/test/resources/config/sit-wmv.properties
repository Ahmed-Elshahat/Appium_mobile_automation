# enters the passcode, so the account's live passcode does not block the journey. Default-tier NAT
# registration seeds no DOB (activateOnlyInDb), so the reset flow SKIPS the User Verification (DOB)
# screen — the dob.* values below are not used for this tier (kept for reference only).
