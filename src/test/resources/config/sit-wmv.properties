# ── Account Provisioning (UserProvisioningTest / *RegistrationApiHelper) ──
# Driverless backend provisioning of fresh URPay accounts. Every key below already has a
# safe default baked into RegistrationApiHelper, so the suite runs without setting any of them:
#   mvn test -Dprofile=sit-wmv -Dsuite=suites/provision-users.xml
# Uncomment / override only to retarget another environment. DO NOT commit secrets here —
# pass DB credentials and the simulator API key at runtime via -Durpay.* or env vars, e.g.
#   -Durpay.registration.db.password=...   (or env URPAY_REGISTRATION_DB_PASSWORD=...)
#   -Durpay.registration.simApiKey=...      (or env URPAY_REGISTRATION_SIMAPIKEY=...)
#registration.baseUrl=https://192.168.100.71:14301/walletapp/v1
#registration.simBaseUrl=https://neoleap-backend-simulator-sit.apps.ocpuat.neoleap.com.sa
#registration.db.url=jdbc:oracle:thin:@//192.168.102.37:1521/wltdbsit.neoleap.com.sa
#registration.otp=1234

