# URPay DMP — LANE D (Physical Order / Mokafaa / Gift) profile
#
# Migrated from Katalon DMP_1 suites (New Test Suites After Revamp):
#   PhysicalMarketPlace/Validate Placing Order With Physical Product
#   FullCycleDigitalMarketPlaceOrder/Validate Placing Order Using Mokafaa Points
#   FullCycleDigitalMarketPlaceOrder/Validate placing order as a gift ...
#
# LANE D owns this file. Do NOT edit sit-dmp.properties (frozen foundation).
# Run with: -Dprofile=sit-dmp-d
#
# ⚠ Order/pay lanes need a DISTINCT DMP user with an ACTIVE (funded) wallet — a stale account raises
#   the "Your wallet has been expired" modal that blocks shopping (seen on Lane C's first user).

# ── Physical Order (ends at delivery-location entry — NO payment) ──
# Katalon setup: "setup test data for placing order with selected physical product suite".
dmpd.physical.mobileNumber=0520601519
dmpd.physical.id=1790830796
dmpd.physical.verificationCode=1234
dmpd.physical.passCode=2233
# Physical product searched by name in the Store.
dmpd.physical.product=Samsung
# In-stock physical product opened directly by Magento SKU (deep link) — avoids the out-of-stock
# brand listings, priced under the test wallet balance so Place Order can complete, and with max
# available quantity. iPhone 16 128GB White = MYDR3AH/A (1035 SAR, salable 1000 per marketplace API).
dmpd.physical.sku=MYDR3AH/A
# Delivery location names entered / edited / added (Katalon AddLocationName).
dmpd.physical.location1=Riyadh KSA
dmpd.physical.location1Edited=Riyadh KSA Test
dmpd.physical.location2=Egpyt

# ── Mokafaa Points order (Validate Placing Order Using Mokafaa Points) ──
# Katalon setup "setup test data for placing order using Mokafaa Points": user 0506020187/1669165878,
# MokafaaPointsAmountToRedeem=1,250,000 (÷400 = 3125 SAR), wallet seeded to 2500 → balance 5625.0.
# NOTE: the account MUST hold at least dmpd.mokafaa.pointsToRedeem Mokafaa points; the wallet-balance
# seed + exact post-redemption balance assertion are backend/VPN-only and omitted (order-placed is
# the primary check). Product: Katalon uses physical router MBROUTER-H138-380-WHT-Brand-open which
# forces a delivery-location step; the Mokafaa redemption lives on Checkout regardless of product, so
# we use the proven DIGITAL SKU 6280066009007 (Lane C) to reach Checkout cleanly (no delivery step).
dmpd.mokafaa.mobileNumber=0520642348
dmpd.mokafaa.id=1859818088
dmpd.mokafaa.verificationCode=1234
dmpd.mokafaa.passCode=2233
dmpd.mokafaa.productSku=6280066009007
dmpd.mokafaa.pointsToRedeem=1250000

# ── Gift order (Validate placing order as a gift and check it sent to gift receiver) ──
# Katalon flow: deep-link the digital product 6280066009007 → add to cart → open cart →
# "Send as gift" → Add New Number (receiver 0506020187) → select gift card → gift message
# "testGift" → Next → pay/confirm. The suite's PayConfirmBtnForGift step is disabled in Katalon;
# the migrated test still completes payment so the gift is actually sent to the receiver.
# NOTE: the sender account MUST have an ACTIVE (funded) wallet to complete the gift payment.
dmpd.gift.mobileNumber=0520438553
dmpd.gift.id=1688508397
dmpd.gift.verificationCode=1234
dmpd.gift.passCode=2233
dmpd.gift.productSku=6280066009007
dmpd.gift.receiverNumber=0506020187
dmpd.gift.message=testGift

